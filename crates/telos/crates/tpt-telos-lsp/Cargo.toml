[package]
name = "tpt-telos-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-telos-lsp"
keywords = ["lsp", "language-server", "ide", "jsonrpc", "telos"]
categories = ["development-tools", "text-editors"]
description = "Language Server Protocol server for tpt-telos"

[dependencies]
tpt-telos-parser = { path = "../tpt-telos-parser", version = "0.2.0" }
tpt-telos-ir = { path = "../tpt-telos-ir", version = "0.2.0" }
tpt-telos-verifier = { path = "../tpt-telos-verifier", version = "0.2.0" }
tpt-telos-router = { path = "../tpt-telos-router", version = "0.2.0" }
tpt-telos-agent = { path = "../tpt-telos-agent", version = "0.2.0" }
tpt-telos-codegen = { path = "../tpt-telos-codegen", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
