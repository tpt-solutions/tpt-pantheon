[package]
name = "out-telos-wasm"
version = "0.2.0"
edition = "2021"
description = "WASM bindings for the tpt-telos parser and verifier (browser playground)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
tpt-telos-parser = { path = "../tpt-telos-parser" }
tpt-telos-ir = { path = "../tpt-telos-ir" }
tpt-telos-verifier = { path = "../tpt-telos-verifier" }
serde_json = "1"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"
