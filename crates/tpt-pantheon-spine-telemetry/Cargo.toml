[package]
name = "tpt-pantheon-spine-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared OTLP emission wrapper for Pantheon telemetry. SPINE §5.4."

[dependencies]
thiserror.workspace = true

# Optional real OTLP backend. Off by default so the base workspace builds and
# tests fast; enable with --features otlp to wire the canonical OTLP exporter.
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", optional = true }

[features]
default = []
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
