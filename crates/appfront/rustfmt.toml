# Formatting config for tpt-appfront.
#
# `group_imports`, `imports_granularity`, and `format_code_in_doc_comments` are
# unstable rustfmt options, so they are ONLY honored by the nightly formatter.
# The `fmt`/`doc` CI jobs and the local `just fmt` / `tpt-appfront fmt` tooling
# therefore invoke `cargo +nightly fmt` — do not run plain `cargo fmt` (stable)
# to format this repo, or the import grouping will be silently dropped and CI's
# `fmt` job will fail the diff.
edition = "2021"
group_imports = "StdExternalCrate"
imports_granularity = "Module"
format_code_in_doc_comments = true
