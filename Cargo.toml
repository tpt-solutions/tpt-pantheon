[workspace]
resolver = "2"
# Only Pantheon's own crates are workspace members. The three vendored Layer-1
# repos (Keystone / Telos / AppFront) are kept as independent workspaces so they
# keep their own `[workspace]` roots, versions, and `workspace = true` manifest
# inheritance — nesting them here would break the build. They are consumed by
# path dependency from the Milestone-1 wedge crate, not as members.
members = ["crates/tpt-pantheon-spine-*"]
exclude = [
    "services/identity",
    "crates/keystone",
    "crates/telos",
    "crates/appfront",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://example.com/tpt-pantheon"

[workspace.dependencies]
# Shared spine crates. Add new internal crates here as they are born.
tpt-pantheon-spine-audit-log = { path = "crates/tpt-pantheon-spine-audit-log", version = "0.1.0" }
tpt-pantheon-spine-wasm-sandbox = { path = "crates/tpt-pantheon-spine-wasm-sandbox", version = "0.1.0" }
tpt-pantheon-spine-telemetry = { path = "crates/tpt-pantheon-spine-telemetry", version = "0.1.0" }

# Common third-party deps pinned for the whole workspace.
thiserror = "2"
tracing = "0.1"
anyhow = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
