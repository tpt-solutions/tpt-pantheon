# cargo-deny configuration for tpt-pantheon.
#
# Standard supply-chain / license gates live here. The one spec-specific rule
# — "no crate may take a *direct* `wasmtime` dependency except
# `tpt-pantheon-spine-wasm-sandbox`" — cannot be expressed as a flat crate ban
# in cargo-deny (a flat ban would also forbid the sandbox crate itself). It is
# therefore enforced by a dedicated graph check: `ci/check-sandbox-boundary`.
# That script is wired into the `deny` justfile recipe and the CI pipeline, and
# is the authoritative enforcement of the §5.3 boundary.

[advisories]
version = 2
yanked = "warn"
# The `wasmtime` / `wasmtime-wasi` advisories below are scoped to the OPTIONAL,
# feature-gated (`wasmtime`) binding of `tpt-pantheon-spine-wasm-sandbox`. That
# binding is NOT part of the default build and has no production consumers yet
# (pre-Milestone-1). The dependency has already been bumped to the patched
# 24.0.x line; the remaining advisories either (a) have no safe upgrade
# available upstream yet, or (b) require wasmtime >=36 which is a major API
# jump — both tracked for when the sandbox binding is actually exercised.
# Crucially, the §5.3 boundary check (ci/check-sandbox-boundary) still forbids a
# direct `wasmtime` dependency outside this single crate, so the supply-chain
# blast radius cannot grow.
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0057",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2026-0096",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "MIT-0",
    "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = [
    # Vendored crates may carry their own upstream license; document here.
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
